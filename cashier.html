<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0"/>
<meta name="theme-color" content="#F4E9DC"/>
<title>MAX DAILY — Cashier Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="loyalty.css"/>
</head>
<body>

<!-- Procedural Paper Grain Overlay -->
<div class="paper-grain" aria-hidden="true"></div>

<div class="wrap">
  <div class="brand-header">
    <h1>MAX DAILY</h1>
    <p>CASHIER • STAMP STATION</p>
  </div>

  <!-- PIN View -->
  <div id="pinView" class="panel">
    <div class="emblem" style="margin-bottom:12px">
      <img src="logo_vertical.svg" alt="MAX DAILY" style="height:88px"/>
    </div>
    <label for="pin" style="text-align:center">ENTER CASHIER PIN</label>
    <div style="position:relative">
      <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" placeholder="••••" style="font-size:26px;letter-spacing:8px;text-align:center;padding:12px 40px 12px 16px"/>
      <button id="togglePin" type="button" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer">👁</button>
    </div>

    <!-- On-screen PIN Pad -->
    <div class="pin-pad">
      <div class="pin-key" data-k="1">1</div><div class="pin-key" data-k="2">2</div><div class="pin-key" data-k="3">3</div>
      <div class="pin-key" data-k="4">4</div><div class="pin-key" data-k="5">5</div><div class="pin-key" data-k="6">6</div>
      <div class="pin-key" data-k="7">7</div><div class="pin-key" data-k="8">8</div><div class="pin-key" data-k="9">9</div>
      <div class="pin-key" data-k="C" style="color:#a3321f">C</div><div class="pin-key" data-k="0">0</div><div class="pin-key" data-k="DEL">⌫</div>
    </div>
    <button id="pinBtn" class="btn gold">UNLOCK STATION</button>
    <div id="pinErr" class="err"></div>
  </div>

  <!-- Main Cashier View -->
  <div id="mainView" class="hidden">
    <div class="panel">
      <button id="scanBtn" class="btn gold" style="margin-top:0">📷 SCAN CUSTOMER QR</button>
      <div id="reader" class="hidden"></div>
      <label for="lookup">OR SEARCH BY PHONE</label>
      <div class="row">
        <input id="lookup" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" dir="ltr"/>
        <button id="lookupBtn" class="btn" style="width:auto;padding:0 22px">FIND</button>
      </div>
      <div id="err" class="err"></div>
    </div>

    <div id="custView" class="loyalty hidden" dir="ltr" style="padding:24px 20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="lb" style="font-size:9px;letter-spacing:0.2em;color:var(--coffee-brown);font-weight:700">CUSTOMER</div>
          <div class="val" id="cName" style="font-size:19px;font-weight:900;color:var(--espresso);margin-top:2px">—</div>
          <div class="hint" id="cPhone" style="text-align:left;font-size:11px;color:var(--coffee-brown);margin-top:2px"></div>
        </div>
        <div style="text-align:right">
          <div class="lb" style="font-size:9px;letter-spacing:0.2em;color:var(--coffee-brown);font-weight:700">STAMPS</div>
          <div class="val" id="cCount" style="font-size:22px;font-weight:900;color:var(--gold-deep)">0/5</div>
        </div>
      </div>

      <div class="stamps" id="stamps" style="margin:18px 0 10px"></div>
      <div class="status" id="status" style="margin-bottom:14px"></div>

      <button id="add2" class="btn gold">+2 أول طلب (FIRST ORDER BONUS)</button>
      <button id="add1" class="btn gold">+1 إضافة ختم (ADD 1 STAMP)</button>
      <button id="redeem" class="btn ghost" style="color:var(--espresso);border-color:var(--gold-deep);font-weight:800;margin-top:10px">🎁 صرف المشروب المجاني (REDEEM)</button>
      <div id="actFeedback" style="text-align:center;font-weight:800;font-size:13px;color:#2E7D32;min-height:20px;margin-top:8px"></div>
    </div>
  </div>

  <p class="small" id="modeNote"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="loyalty.js"></script>
<script>
const $ = id => document.getElementById(id), S = MDStore, C = MD_CONFIG;
const CUP = `<svg viewBox="0 0 64 64" class="cup" style="width:100%;height:100%">
  <rect x="11" y="15" width="42" height="6" rx="3" fill="#D9AE7B"/>
  <path d="M14 21h36l-4.6 36.5a3 3 0 0 1-3 2.5H21.6a3 3 0 0 1-3-2.5z" fill="#D9AE7B"/>
  <path d="M15.6 31h32.8l-1.5 12H17.1z" fill="#1A120D"/>
  <text x="32" y="36.8" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="900" font-size="5.6" letter-spacing=".8" fill="#F4E9DC">MAX</text>
  <text x="32" y="41.6" text-anchor="middle" font-family="Montserrat,sans-serif" font-weight="800" font-size="3.4" letter-spacing="1.1" fill="#D9AE7B">DAILY</text>
</svg>`;

let cust = null, scanner = null;
$('modeNote').textContent = S.mode==='demo' ? 'DEMO MODE — data stored in this browser only' : '';

function unlock(){
  $('pinView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  sessionStorage.setItem('md_unlocked','1');
}
$('pinBtn').onclick = () => $('pin').value.trim()===C.CASHIER_PIN ? unlock() : ($('pinErr').textContent='Wrong PIN • الرقم السري غير صحيح');
$('pin').onkeydown = e => e.key==='Enter' && $('pinBtn').click();
if (sessionStorage.getItem('md_unlocked')) unlock();

// PIN Pad Click Handlers
document.querySelectorAll('.pin-key').forEach(btn => {
  btn.onclick = () => {
    const k = btn.getAttribute('data-k'), p = $('pin');
    if (k === 'C') p.value = '';
    else if (k === 'DEL') p.value = p.value.slice(0, -1);
    else if (p.value.length < 8) p.value += k;
    $('pinErr').textContent = '';
  };
});
$('togglePin').onclick = () => {
  const p = $('pin');
  p.type = p.type === 'password' ? 'text' : 'password';
};

function show(){
  $('custView').classList.remove('hidden');
  $('err').textContent = '';
  $('cName').textContent = cust.name;
  $('cPhone').textContent = cust.phone;
  $('cCount').textContent = `${cust.stamps}/${S.TOTAL}`;
  $('stamps').innerHTML = Array.from({length:S.TOTAL},(_,i)=>`<div class="stamp ${i<cust.stamps?'on':''}">${CUP}</div>`).join('');
  const full = cust.stamps >= S.TOTAL;
  $('status').className = 'status' + (full ? ' reward' : '');
  $('status').textContent = full ? '🎉 FREE DRINK AVAILABLE • يستحق مشروب مجاني' : (cust.first_order ? 'First visit — eligible for +2 bonus' : `Needs ${S.TOTAL - cust.stamps} more stamps`);
  $('add2').classList.toggle('hidden', !(cust.first_order && cust.stamps === 0));
  $('add1').disabled = full;
  $('redeem').disabled = !full;
  $('add1').classList.toggle('hidden', cust.first_order && cust.stamps === 0);
}

async function load(raw){
  $('err').textContent = '';
  try {
    raw = (raw || '').trim();
    // 1. Direct packet from QR Code
    if (raw.startsWith('{') && raw.endsWith('}')) {
      const p = JSON.parse(raw);
      if (p.phone) {
        cust = {
          id: p.id || p.phone,
          phone: p.phone,
          name: p.name || 'Customer',
          stamps: Number(p.stamps || 0),
          visits: Number(p.visits || 0),
          redeemed: Number(p.redeemed || 0),
          first_order: p.first_order !== false
        };
        S.cacheCustomer(cust);
        show();
        // Background check for latest stamps from Google Sheet
        S.findByPhone(p.phone).then(latest => {
          if (latest && (latest.stamps !== cust.stamps || latest.visits !== cust.visits)) {
            cust = latest;
            show();
          }
        }).catch(()=>{});
        return;
      }
    }
    // 2. Local database / phone lookup
    cust = await S.get(raw);
    if (!cust) cust = await S.findByPhone(raw);
    if (!cust) throw new Error('Customer not found • تعذر العثور على العميل');
    show();
  } catch(e) {
    $('err').textContent = e.message;
  }
}

async function act(a){
  try {
    const feedback = $('actFeedback');
    feedback.textContent = 'جاري التحديث...';
    cust = await S.apply(cust.id, a);
    S.wallet('sync', cust.id).catch(()=>{});
    show();
    feedback.textContent = '✓ تم تسجيل الختم ومزامنته فوراً!';
    setTimeout(() => { feedback.textContent = ''; }, 3000);
    if (navigator.vibrate) navigator.vibrate(80);
  } catch(e) {
    $('err').textContent = e.message;
    $('actFeedback').textContent = '';
  }
}

$('add2').onclick = () => act('ADD_2_FIRST');
$('add1').onclick = () => act('ADD_1');
$('redeem').onclick = () => {
  if (confirm('صرف المشروب المجاني وإعادة تصفير الكارت؟')) act('REDEEM');
};

$('lookupBtn').onclick = async () => {
  const val = $('lookup').value.trim();
  if (!val) return;
  $('err').textContent = 'جاري البحث...';
  try {
    cust = await S.findByPhone(val);
    if (!cust) throw new Error('لا يوجد عميل مسجل بهذا الرقم');
    $('err').textContent = '';
    show();
  } catch(e) {
    $('err').textContent = e.message;
  }
};

$('scanBtn').onclick = async () => {
  const r = $('reader');
  if (scanner) {
    await scanner.stop().catch(()=>{});
    scanner = null;
    r.classList.add('hidden');
    $('scanBtn').textContent = '📷 SCAN CUSTOMER QR';
    return;
  }
  r.classList.remove('hidden');
  $('scanBtn').textContent = '✖ STOP CAMERA';
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, async txt => {
    await scanner.stop().catch(()=>{});
    scanner = null;
    r.classList.add('hidden');
    $('scanBtn').textContent = '📷 SCAN CUSTOMER QR';
    load(txt.trim());
  }).catch(e => {
    $('err').textContent = 'Camera error: ' + e;
    scanner = null;
    r.classList.add('hidden');
  });
};
</script>
</body>
</html>
